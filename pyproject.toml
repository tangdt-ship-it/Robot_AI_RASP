[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-ai-rasp"
version = "0.1.0a1"
description = "Robot_AI high-level controller for Raspberry Pi Zero 2 W"
requires-python = ">=3.10,<3.13"
dependencies = [
  "PyYAML>=6.0.2,<7",
  "pyserial>=3.5,<4",
  "pyserial-asyncio>=0.6,<1",
]

[project.optional-dependencies]
wakeword = ["sherpa-onnx>=1.12.0", "numpy>=1.26,<3", "sounddevice>=0.5,<1"]
hardware = ["spidev>=3.6,<4", "gpiod>=2.3,<3", "Pillow>=10,<13"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[project.scripts]
robot-ai = "robot_ai_rasp.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
